services:
  postgres:
    image: postgres:16-alpine
    container_name: multicatalogo-postgres
    environment:
      POSTGRES_DB: multicatalogo
      POSTGRES_USER: multicatalogo
      POSTGRES_PASSWORD: multicatalogo123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - multicatalogo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multicatalogo -d multicatalogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: multicatalogo-redis
    ports:
      - "6379:6379"
    networks:
      - multicatalogo-network

volumes:
  postgres_data:

networks:
  multicatalogo-network:
    driver: bridge
